    <!-- Particle Layers -->
    <div id="particle-system">
        
        <!-- Morphology SVG Filter for AIDA Merging -->
        <svg style="visibility: hidden; position: absolute;" width="0" height="0">
            <defs>
                <filter id="aida-merge">
                    <!-- Expand the combined black circles to create the outline thickness -->
                    <feMorphology in="SourceGraphic" operator="dilate" radius="2" result="dilated" />
                    <feFlood flood-color="#ffffff" result="white_color" />
                    <!-- Mask the expanded shape with the white color -->
                    <feComposite in="white_color" in2="dilated" operator="in" result="white_outline" />

                    <!-- Create the blurry shadow behind the white outline -->
                    <feGaussianBlur in="white_outline" stdDeviation="5" result="shadow_blur" />
                    <feFlood flood-color="#000000" result="black_color" />
                    <feComposite in="black_color" in2="shadow_blur" operator="in" result="black_shadow" />

                    <!-- Layer: Shadow -> White Outline -> Black Circles -->
                    <feMerge>
                        <feMergeNode in="black_shadow" />
                        <feMergeNode in="white_outline" />
                        <!-- SourceGraphic black bubbles -->
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
        </svg>

        <div id="hexagon-space"></div>
        <div id="bubble-space"></div>
    </div>
